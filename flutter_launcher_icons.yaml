# Keep the original supplied artwork unchanged. The generator creates platform sizes.
# Regenerate with: python tool/brand_assets.py
# The wrapper preserves an unrelated Xcode setting affected by generator 0.14.4.
flutter_launcher_icons:
  image_path: assets/brand/app-icon-source.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: '#F5EFE6'
  adaptive_icon_foreground: assets/brand/app-icon-source.png
  adaptive_icon_foreground_inset: 20
  ios: true
  remove_alpha_ios: true
  background_color_ios: '#F5EFE6'
  web:
    generate: true
    image_path: assets/brand/app-icon-source.png
    background_color: '#F5EFE6'
    theme_color: '#F5EFE6'
