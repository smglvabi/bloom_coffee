<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5EFE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1A17" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Bloom — ваш кофе, рецепты и маленькие открытия. Личный журнал завариваний V60.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bloom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Bloom — ваша следующая чашка</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body { margin:0; height:100%; background:#F5EFE6; }
    #loading { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#302820; font-family:sans-serif; }
    #loading strong { font-weight:500; font-size:48px; letter-spacing:-3px; }
    #loading span { margin-top:16px; font-size:13px; color:#6F6962; }
    @media (prefers-color-scheme: dark) {
      html,body { background:#1E1A17; }
      #loading { color:#F5EFE6; }
      #loading span { color:#B7ADA2; }
    }
  </style>
</head>
<body>
  <div id="loading"><strong>bloom</strong><span>Готовим вашу кофейную полку…</span></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
